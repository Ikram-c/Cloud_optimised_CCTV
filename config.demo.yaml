gop:
  gop_frames: 30
  max_video_frames: 3000
flow:
  analysis_size:
  - 128
  - 96
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2
  min_magnitude_px: 0.5
  min_area_frac: 0.003
  pause_buffer_s: 5.0
  match_distance_frac: 0.2
  min_track_frames: 3
  max_tracks: 32
zarr:
  resize_width: 320
  grayscale: false
  compression_level: 6
archive:
  gcs_bucket: cctv-archive
  gcs_prefix: sites/default
  use_mock_gcs: true
  local_root: mock_gcs
runtime:
  video_directory: videos
  store_directory: stores
  default_fps: 25.0
  max_consecutive_fails: 25
  video_extensions:
  - .mp4
  - .avi
  - .mkv
  - .mov
  timezone: UTC
ui:
  host: 127.0.0.1
  port: 8432
  preview_width: 480
  preview_max_frames: 40
  max_upload_mb: 50
  max_queued_jobs: 4
retention:
  enabled: true
  movement_max_age_hours: 720
  non_movement_max_age_hours: 72
  exports_max_age_hours: 72
  cache_max_age_hours: 24
  keep_non_movement: true
  source_after_ingest: keep
governance:
  controller: ""
  site_id: ""
  purpose: "demonstration"
  legal_basis: ""
  retention_policy: ""
  dpo_contact: ""
security:
  auth_token: ""
  allow_remote: false
  encrypt_archive: false
  encryption_key: ""
