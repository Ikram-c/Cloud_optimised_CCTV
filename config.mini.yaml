gop:
  gop_frames: 30
  max_video_frames: 300
flow:
  analysis_size:
  - 96
  - 72
  pyr_scale: 0.5
  levels: 2
  winsize: 11
  iterations: 2
  poly_n: 5
  poly_sigma: 1.2
  min_magnitude_px: 0.5
  min_area_frac: 0.003
  pause_buffer_s: 5.0
  match_distance_frac: 0.2
  min_track_frames: 3
  max_tracks: 16
zarr:
  resize_width: 240
  grayscale: false
  compression_level: 3
archive:
  gcs_bucket: cctv-archive
  gcs_prefix: sites/mini-demo
  use_mock_gcs: true
  local_root: mock_gcs
runtime:
  video_directory: videos
  store_directory: stores
  default_fps: 25.0
  max_consecutive_fails: 25
  video_extensions:
  - .mp4
  - .avi
  - .mkv
  - .mov
  timezone: UTC
ui:
  host: 127.0.0.1
  port: 8432
  preview_width: 320
  preview_max_frames: 12
  max_upload_mb: 25
  max_queued_jobs: 2
retention:
  enabled: true
  movement_max_age_hours: 168
  non_movement_max_age_hours: 24
  exports_max_age_hours: 12
  cache_max_age_hours: 12
  keep_non_movement: true
  source_after_ingest: quarantine
governance:
  controller: ""
  site_id: "pythonanywhere-mini-demo"
  purpose: "demonstration"
  legal_basis: ""
  retention_policy: "7d movement / 24h quiet / 12h exports"
  dpo_contact: ""
security:
  auth_token: ""
  allow_remote: false
  encrypt_archive: false
  encryption_key: ""
