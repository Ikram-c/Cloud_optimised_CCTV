[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv_zarr"
version = "0.1.0"
description = "CCTV-optimised, movement-aware OME-Zarr archival and chunk-level cloud query"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ikram Choudhury"}]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.14"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "cctv_zarr[ui]"]

[project.scripts]
cctv-zarr = "cctv_zarr.cli:main"
cctv-zarr-ui = "cctv_zarr.webapp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
